name: Report a problem
description: Report an instruction, installation, template or script problem with a reproducible example.
body:
  - type: markdown
    attributes:
      value: Use synthetic or public examples. Do not include private documents, personal data, API keys or confidential inventions.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the skill name and release or commit you used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Agent host/model and relevant OS or Python version, if applicable.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal prompt, steps or public/synthetic input that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Explain what should happen, what happened instead, and any relevant source or error message.
    validations:
      required: true
